version: "3.9"
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/digital-heroes-db
      - JWT_SECRET=replace-with-a-secure-secret
      - CLIENT_URL=http://localhost:4173
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://server:5000/api
    ports:
      - "4173:4173"
    depends_on:
      - server

volumes:
  mongo-data:
    name: digital-heroes-mongo-data
